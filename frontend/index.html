<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>小家 · 花园麻将</title>
  <link rel="stylesheet" href="css/style.css?v=20261012garden" />
</head>
<body class="garden-mahjong">
  <div class="lobby-container">

    <!-- Header -->
    <header class="lobby-header">
      <button id="back-entertainment" class="btn btn-secondary" hidden>返回娱乐室</button><p>OUR LITTLE GARDEN</p><h1>树荫下 · 麻将</h1>
      <p>留一桌闲暇，等朋友入座。</p>
    </header>

    <!-- Player info -->
    <div class="player-info-bar">
      <label for="nickname">昵称</label><input id="nickname" maxlength="32" placeholder="朋友" autocomplete="nickname" />
      <span class="pid" id="player-id-display">loading…</span>
    </div>

    <div class="lobby-actions" style="flex-wrap:wrap;gap:12px">
      <label for="room-code">房间码</label><input id="room-code" size="38" placeholder="粘贴房间码" />
      <button class="btn btn-secondary" id="btn-join-room">加入房间</button>
      <label><input id="ai-fill" type="checkbox" checked /> 新房间空位由 Local AI 补齐</label>
    </div>
    <p>邀请朋友和官端椒椒入座后，由房主开始。返回大厅或刷新会保留座位。</p>
    <!-- Room list + create button -->
    <div class="lobby-actions">
      <h2>我的房间</h2>
      <button class="btn btn-primary" id="btn-create-room">+ 创建房间</button>
    </div>

    <div class="rooms-table-wrap">
      <table class="rooms-table">
        <thead>
          <tr>
            <th>Room Name</th>
            <th>Players</th>
            <th>Status</th>
            <th>筹码 / Chips</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="rooms-tbody">
          <tr>
            <td colspan="5" class="no-rooms">Loading rooms…</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="refresh-indicator" id="refresh-time">Auto-refresh every 3 seconds</div>

  </div><!-- /lobby-container -->

  <script src="js/lobby.js"></script>
</body>
</html>
